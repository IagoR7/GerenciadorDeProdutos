<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="col-md-6 mx-auto">

            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white text-center">
                    <h5 class="mb-0">Cadastro de Produto</h5>
                </div>
                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" id="nome" class="form-control" placeholder="Digite o nome do produto">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantidade</label>
                        <input type="number" id="quantidade" class="form-control" min="0" placeholder="Digite a quantidade">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Preço</label>
                        <input type="number" step="0.01" id="preco" class="form-control" placeholder="Digite o preço">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoria</label>
                        <select id="categoria" class="form-select"></select>
                    </div>
                    <div>
                       
                          <a href="CadastroCategoria.html" class="btn btn-link">Adicionar nova categoria</a>

                    </div>

                    <button class="btn btn-success w-100" id="btnCadastrar">Cadastrar</button>
                    <button class="btn btn-secondary w-100 mt-2" id="btnLimpar">Limpar</button>

                    <div class="text-center mt-3">
                        
                        <a href="listarProdutos.html" class="btn btn-outline-dark w-100 mt-2">Voltar</a>
                    </div>

                    <div id="mensagem" class="mt-3"></div>

                </div>
            </div>

        </div>
    </div>


    <script>
        const idUsuario = localStorage.getItem("usuarioId");

        if (!idUsuario) {
            alert("Você precisa fazer login!");
            window.location.href = "login.html";
        }

        
        async function carregarCategorias() {
            const idUsuario = Number(localStorage.getItem("usuarioId"));
            const mensagemDiv = document.getElementById("mensagem");
            if (!idUsuario) {
                mensagemDiv.innerHTML = `<div class="alert alert-danger">Usuário não encontrado. Faça login.</div>`;
                return;
            }

            try {
                const response = await fetch(`http://localhost:8080/categorias/listar/usuario/${encodeURIComponent(idUsuario)}`);
                if (!response.ok) {
                    mensagemDiv.innerHTML = `<div class="alert alert-danger">Erro ao carregar categorias: ${response.status}</div>`;
                    return;
                }
                const categorias = await response.json();
                const select = document.getElementById("categoria");
                select.innerHTML = "";
                categorias.forEach(cat => {
                    const option = document.createElement("option");
                    option.value = cat.id;
                    option.textContent = cat.nome;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error("Erro ao carregar categorias:", err);
                document.getElementById("mensagem").innerHTML = `<div class="alert alert-danger">Erro ao carregar categorias!</div>`;
            }
        }


        document.getElementById("btnCadastrar").addEventListener("click", async () => {

            const nome = document.getElementById("nome").value.trim();
            const quantidade = parseInt(document.getElementById("quantidade").value);
            const preco = parseFloat(document.getElementById("preco").value);
            const categoria = document.getElementById("categoria").value;

            const mensagemDiv = document.getElementById("mensagem");
            mensagemDiv.innerHTML = "";

            if (!nome || isNaN(quantidade) || isNaN(preco) || !categoria) {
                mensagemDiv.innerHTML = `<div class="alert alert-warning">Preencha todos os campos!</div>`;
                return;
            }

            const idUsuario = Number(localStorage.getItem("usuarioId")); 


            if (!idUsuario) {
                mensagemDiv.innerHTML =
                    `<div class="alert alert-danger">Nenhum usuário logado encontrado! Faça login novamente.</div>`;
                return;
            }

            const produto = {
                nome,
                quantidade,
                preco,
                categoria: { id: Number(categoria) },
                usuario: { id: idUsuario }
            };

            try {
                const response = await fetch("http://localhost:8080/produtos/cadastrar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(produto)
                });

                
                let data;
                const contentType = response.headers.get("content-type") || "";
                if (contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    try { data = JSON.parse(text); } catch (e) { data = { mensagem: text }; }
                }

                console.log("POST /produtos/cadastrar ->", response.status, data);

                if (!response.ok) {
                    const msg = data?.mensagem || data?.message || JSON.stringify(data) || response.statusText;
                    mensagemDiv.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
                } else {
                    mensagemDiv.innerHTML = `<div class="alert alert-success">Produto cadastrado com sucesso!</div>`;
                    limparCampos();
                }

            } catch (error) {
                console.error("Erro ao cadastrar produto:", error);
                mensagemDiv.innerHTML =
                    `<div class="alert alert-danger">Erro ao conectar ao servidor!</div>`;
            }
        });


        
        document.getElementById("btnLimpar").addEventListener("click", limparCampos);

        function limparCampos() {
            document.getElementById("nome").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("preco").value = "";
            document.getElementById("categoria").selectedIndex = 0;
        }


        
        carregarCategorias();
    </script>

</body>

</html>
