<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Minhas Movimentações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand">Controle de Estoque</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="ListarProdutos.html">Produtos</a></li>
          <li class="nav-item"><a class="nav-link" href="CadastroProdutos.html">Adicionar</a></li>
          <li class="nav-item"><a class="nav-link" href="AlterarProdutos.html">Editar</a></li>
          <li class="nav-item"><a class="nav-link" href="DeletarProdutos.html">Remover</a></li>
          <li class="nav-item"><a class="nav-link active" href="Movimentacoes.html">Movimentações</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="login.html" id="btnSair">Sair</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Histórico de Movimentações</h4>
      <div>
        <button id="btnRefresh" class="btn btn-sm btn-primary">
          <i class="bi bi-arrow-clockwise"></i> Atualizar
        </button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0 align-middle">
            <thead class="table-dark text-center">
              <tr>
                <th>Codigo</th>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Ação</th>
                <th>Quantidade</th>
                <th>Data/Hora</th>
              </tr>
            </thead>
            <tbody id="tabelaMovimentacoes">
              <tr>
                <td colspan="6" class="text-center p-3">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "http://localhost:8080"; 

    const idUsuarioLogado = localStorage.getItem("usuarioId");

    if (!idUsuarioLogado) {
        alert("Você precisa estar logado!");
        window.location.href = "login.html";
    }

   
    document.getElementById("btnSair").addEventListener("click", () => {
        localStorage.removeItem("usuarioId");
    });

    function traduzTipo(tipo) {
      if (!tipo) return "Desconhecido";
      const t = tipo.toString().toLowerCase();
      if (t === "entrada") return "Adicionado";
      if (t === "saida" || t === "saída") return "Removido";
      if (t === "alteracao" || t === "editado" || t === "edicao") return "Editado";
      return tipo;
    }

    function getClassPorTipo(tipo) {
      if (!tipo) return "bg-secondary";
      const t = tipo.toString().toLowerCase();
      
      if (t === "entrada") return "bg-success"; 
      if (t === "saida" || t === "saída") return "bg-danger"; 
      if (t === "editado" || t === "alteracao") return "bg-primary"; 
      
      return "bg-secondary"; 
    }

    function formatData(dataRaw) {
      if (!dataRaw) return "";
      try {
        const d = new Date(dataRaw);
        if (isNaN(d)) return dataRaw;
        return d.toLocaleString("pt-BR");
      } catch (e) {
        return dataRaw;
      }
    }

    async function carregarMovimentacoes() {
      const tbody = document.getElementById("tabelaMovimentacoes");
      tbody.innerHTML = `<tr><td colspan="6" class="text-center p-3">Carregando...</td></tr>`;

      try {
        
        const res = await fetch(`${API}/movimentacoes/usuario/${idUsuarioLogado}`);
        
        if (!res.ok) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger p-3">Erro: ${res.status}</td></tr>`;
          return;
        }

        const lista = await res.json();
        
        
        lista.sort((a, b) => b.id - a.id);

        if (!Array.isArray(lista) || lista.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center p-3 text-muted">Você ainda não realizou nenhuma movimentação.</td></tr>`;
          return;
        }

        tbody.innerHTML = "";
        lista.forEach(m => {
          const tr = document.createElement("tr");
          
          const textoAcao = traduzTipo(m.tipo);
          const corBadge = getClassPorTipo(m.tipo);
          const horario = formatData(m.dataMovimentacao ?? m.data ?? m.dataHora);
          const nomeCategoria = m.produto?.categoria?.nome ?? "N/D";

          tr.innerHTML = `
            <td class="text-center fw-bold text-dark">${m.id ?? ""}</td>
            <td>${m.produto?.nome ?? "<span class='text-muted'>Produto Excluído</span>"}</td>
            <td>${nomeCategoria}</td>
            <td class="text-center">
                <span class="badge ${corBadge} rounded-pill" style="min-width: 80px;">
                    ${textoAcao}
                </span>
            </td>
            <td class="text-center fw-bold">${m.quantidade ?? 0}</td>
            <td class="text-center text-muted small">${horario}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger p-3">Falha ao buscar dados.</td></tr>`;
      }
    }

    document.getElementById("btnRefresh").addEventListener("click", carregarMovimentacoes);

    carregarMovimentacoes();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
