<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Listagem de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand">Controle de Estoque</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="ListarProdutos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="CadastroProdutos.html">Adicionar</a></li>
                    <li class="nav-item"><a class="nav-link" href="AlterarProdutos.html">Editar</a></li>
                    <li class="nav-item"><a class="nav-link" href="DeletarProdutos.html">Remover</a></li>
                    <li class="nav-item"><a class="nav-link" href="Movimentacoes.html">Movimentações</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="login.html" id="btnSair">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Produtos Cadastrados</h5>
                <button id="btnCarregar" class="btn btn-outline-light btn-sm bg-primary">Recarregar</button>
            </div>

            <div class="card-body">
                <div id="mensagem" class="mb-3"></div>

                <div class="table-responsive">
                    <table id="tabelaProdutos" class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr class="text-center">
                                <th>Codigo</th>
                                <th>Nome</th>
                                <th>Quantidade</th>
                                <th>Preço</th>
                                <th>Categoria</th>
                                <th>Usuário</th>
                                <th>Data Cadastro</th>
                            </tr>
                        </thead>
                        <tbody class="text-center">
                            
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabelaBody = document.querySelector('#tabelaProdutos tbody');
        const mensagemDiv = document.getElementById('mensagem');

        async function carregarProdutos() {
            const usuarioId = localStorage.getItem("usuarioId");

            if (!usuarioId) {
                window.location.href = "login.html";
                return;
            }

            tabelaBody.innerHTML =
                '<tr><td colspan="7" class="text-center">Carregando...</td></tr>';

            try {
                const response = await fetch(`http://localhost:8080/produtos/listar/${usuarioId}`);

                if (!response.ok) {
                    mensagemDiv.innerHTML = `<div class="alert alert-danger">Erro ao buscar produtos.</div>`;
                    tabelaBody.innerHTML = "";
                    return;
                }

                const produtos = await response.json();
                tabelaBody.innerHTML = "";

                if (!produtos || produtos.length === 0) {
                    tabelaBody.innerHTML =
                        '<tr><td colspan="7" class="text-center">Nenhum produto cadastrado.</td></tr>';
                    return;
                }

                produtos.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                    <td>${p.id ?? ''}</td>
                    <td>${p.nome ?? ''}</td>
                    <td>${p.quantidade ?? 0}</td>
                    <td>R$ ${Number(p.preco ?? 0).toFixed(2)}</td>
                    <td>${p.categoria?.nome ?? ""}</td>
                    <td>${p.usuario?.login ?? ""}</td>
                    <td>${p.dataCadastro ? p.dataCadastro.replace("T", " ").substring(0, 19) : ""}</td>
                `;
                    tabelaBody.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                mensagemDiv.innerHTML = `<div class="alert alert-danger">Erro ao conectar ao servidor.</div>`;
                tabelaBody.innerHTML = "";
            }
        }

        document.getElementById('btnCarregar').addEventListener('click', carregarProdutos);
        document.addEventListener('DOMContentLoaded', carregarProdutos);

        document.getElementById('btnSair').addEventListener('click', () => {
            localStorage.clear();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
