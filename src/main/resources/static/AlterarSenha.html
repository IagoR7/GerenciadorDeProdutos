<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Alterar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5 col-md-4">

        <h3 class="text-center mb-4">Alterar Senha</h3>

        <div class="card p-4 shadow-sm">

            <div class="mb-3">
                <label class="form-label">Login:</label>
                <input type="text" id="login" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nova Senha:</label>
                <input type="password" id="novaSenha" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirmar Nova Senha:</label>
                <input type="password" id="confirmaSenha" class="form-control" required>
            </div>

            <button class="btn btn-success w-100" onclick="alterarSenha()">Alterar Senha</button>
            <button class="btn btn-secondary w-100 mt-2" onclick="voltar()">Voltar</button>

            <div id="mensagem" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        async function alterarSenha() {
            const login = document.getElementById("login").value.trim();
            const novaSenha = document.getElementById("novaSenha").value.trim();
            const confirmaSenha = document.getElementById("confirmaSenha").value.trim();

            if (!login || !novaSenha || !confirmaSenha) {
                mostrarMensagem("Preencha todos os campos!", "danger");
                return;
            }

            if (novaSenha !== confirmaSenha) {
                mostrarMensagem("As senhas não coincidem!", "danger");
                return;
            }

            try {
                const response = await fetch("/usuarios/alterarSenha", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        login: login,
                        senha: novaSenha
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarMensagem(data.mensagem, "success");
                    setTimeout(() => window.location.href = "login.html", 1500);
                } else {
                    mostrarMensagem(data.mensagem || "Erro ao alterar a senha!", "danger");
                }

            } catch (error) {
                mostrarMensagem("Erro ao conectar com o servidor!", "danger");
            }
        }

        function mostrarMensagem(msg, tipo) {
            document.getElementById("mensagem").innerHTML =
                `<div class="alert alert-${tipo}">${msg}</div>`;
        }

        function voltar() {
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
